<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%9F%A3</text></svg>">
<title>Roman ŠVESTKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== BARVY - Krémová + elektrická fialová ===== */
  :root{
    --bg: #EBE3D9;        /* krémová */
    --ink: #5B2CD6;       /* elektrická fialová */
    --muted: #5B2CD6;     /* stejná fialová, jen se sníženou průhledností u ikon */
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ -webkit-text-size-adjust: 100%; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    line-height: 1.6;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    text-align: center;
    font-size: clamp(1rem, 0.95rem + 0.4vw, 1.15rem);
  }

  .center{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 6vw, 5rem);
  }
  .wrap{ width: 100%; max-width: 560px; }

  h1{
    font-weight: 700;
    font-size: clamp(1.9rem, 1.4rem + 2.3vw, 3rem);
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: clamp(2rem, 6vh, 3rem);
  }

  .contact .row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    margin-bottom: 0.6rem;
  }
  .contact .row svg{ width: 1.05em; height: 1.05em; flex: none; opacity: 0.7; }
  .contact a{
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(91,44,214,.4);
    transition: opacity .2s ease, border-color .2s ease;
    word-break: break-word;
  }
  .contact a:hover{ opacity: 0.7; }

  footer{
    padding: 1.2rem;
    font-size: 0.8rem;
    opacity: 0.6;
  }
</style>
</head>
<body>

  <div class="center">
    <div class="wrap">
      <h1>Roman ŠVESTKA</h1>
      <div class="contact">
        <div class="row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <a href="mailto:roman@svestka.xyz">roman@svestka.xyz</a>
        </div>
        <div class="row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L17 13l4 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg>
          <a href="tel:+420603466469">+420 603 466 469</a>
        </div>
      </div>
    </div>
  </div>

  <footer>© <span id="rok"></span> Roman ŠVESTKA</footer>

<script>
  document.getElementById('rok').textContent = new Date().getFullYear();
</script>
</body>
</html>
